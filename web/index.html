<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Anatomie Lernprogramm</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header id="mobile-header">
        <button id="hamburger-btn" aria-label="Menü öffnen">&#9776;</button>
        <span id="mobile-title">Anatomie Lernkarten</span>
        <button id="mobile-help-btn" aria-label="Lösung anzeigen" class="hidden">&#10067;</button>
    </header>

    <div id="drawer-overlay"></div>

    <div id="app">

        <nav id="sidebar">
            <button id="drawer-close" aria-label="Menü schließen">&#10005;</button>
            <div id="menu-loading">Lade Menü…</div>
            <ul id="menu-root"></ul>
        </nav>

        <main id="learn-area">
            <div id="placeholder">
                <p>Wähle ein Thema aus dem Menü.</p>
            </div>
            <div id="quiz-wrapper" class="hidden">
                <div id="zoom-container">
                    <img id="quiz-img" alt="Anatomie-Bild">
                </div>
            </div>
            <div id="text-quiz-wrapper" class="hidden"></div>
        </main>

    </div>

    <!-- Help modal -->
    <div id="help-modal" class="hidden" role="dialog" aria-modal="true" aria-labelledby="modal-heading">
        <div id="modal-box">
            <h3 id="modal-heading">Korrekte Antwort:</h3>
            <p id="modal-solution"></p>
            <button id="modal-close">Got it</button>
        </div>
    </div>

    <script src="js/levenshtein.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/zoom.js"></script>
    <script src="js/quiz.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
