<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anatomie Lernprogramm</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">

        <nav id="sidebar">
            <div id="menu-loading">Lade Menü…</div>
            <ul id="menu-root"></ul>
        </nav>

        <main id="learn-area">
            <div id="placeholder">
                <p>Wähle ein Thema aus dem Menü.</p>
            </div>
            <div id="quiz-wrapper" class="hidden">
                <img id="quiz-img" alt="Anatomie-Bild">
            </div>
        </main>

    </div>

    <!-- Help modal -->
    <div id="help-modal" class="hidden" role="dialog" aria-modal="true" aria-labelledby="modal-heading">
        <div id="modal-box">
            <h3 id="modal-heading">Korrekte Antwort:</h3>
            <p id="modal-solution"></p>
            <button id="modal-close">Got it</button>
        </div>
    </div>

    <script src="js/levenshtein.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/quiz.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
